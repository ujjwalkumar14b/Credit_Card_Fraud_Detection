<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1e293b;
            --accent: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #334155;
        }

        input, select {
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .result-box.fraud {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .result-box.legit {
            background-color: #f0fdf4;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .error-box {
            background-color: #fff1f2;
            color: #9f1239;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Credit Card Fraud Detection</h1>
        <p class="subtitle">Enter transaction details below to check for potential fraudulent activity.</p>

        <form action="/predict" method="POST">
            <div class="grid">
                <div class="form-group">
                    <label for="trans_date_trans_time">Transaction Date & Time</label>
                    <input type="datetime-local" id="trans_date_trans_time" name="trans_date_trans_time" required>
                </div>

                <div class="form-group">
                    <label for="amt">Amount ($)</label>
                    <input type="number" step="0.01" id="amt" name="amt" placeholder="e.g. 107.23" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="entertainment">Entertainment</option>
                        <option value="food_dining">Food & Dining</option>
                        <option value="gas_transport">Gas & Transport</option>
                        <option value="grocery_net">Grocery Online</option>
                        <option value="grocery_pos" selected>Grocery Store</option>
                        <option value="health_fitness">Health & Fitness</option>
                        <option value="home">Home</option>
                        <option value="kids_pets">Kids & Pets</option>
                        <option value="misc_net">Misc Online</option>
                        <option value="misc_pos">Misc Store</option>
                        <option value="personal_care">Personal Care</option>
                        <option value="shopping_net">Shopping Online</option>
                        <option value="shopping_pos">Shopping Store</option>
                        <option value="travel">Travel</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="F">Female</option>
                        <option value="M">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="lat">User Latitude</label>
                    <input type="number" step="any" id="lat" name="lat" placeholder="e.g. 48.8878" required>
                </div>

                <div class="form-group">
                    <label for="long">User Longitude</label>
                    <input type="number" step="any" id="long" name="long" placeholder="e.g. -118.2105" required>
                </div>

                <div class="form-group">
                    <label for="merch_lat">Merchant Latitude</label>
                    <input type="number" step="any" id="merch_lat" name="merch_lat" placeholder="e.g. 49.1590" required>
                </div>

                <div class="form-group">
                    <label for="merch_long">Merchant Longitude</label>
                    <input type="number" step="any" id="merch_long" name="merch_long" placeholder="e.g. -118.1864" required>
                </div>
            </div>

            <button type="submit" class="btn">Analyze Transaction</button>
        </form>

        {% if result %}
            <div class="result-box {% if result.is_fraud %}fraud{% else %}legit{% endif %}">
                Prediction: {{ result.label }}<br>
                Fraud Risk Probability: {{ result.fraud_probability }}%
            </div>
        {% endif %}

        {% if error %}
            <div class="error-box">
                Error processing prediction: {{ error }}
            </div>
        {% endif %}
    </div>
</div>

</body>
</html>
